production:
  image: node:lts-alpine
  stage: deploy_production
  script:
    - apk add --no-cache openssh
    - apk add --update bash
    - apk add --update git
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - chmod 700 ~/.ssh
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' > ./deploy.key
    - chmod 600 ./deploy.key
    - npm install -g npm@latest
    - npm list -g pm2 || npm i -g pm2
    - pm2 deploy ecosystem.config.js landing_production
    # - pm2 deploy ecosystem.config.js game_production
  only:
    - main
