stages:
  - build
  - deploy

.before_script_staging_template:
  before_script:
    - export NEXT_PUBLIC_ENABLE_GAME=true
    - export NEXT_PUBLIC_TESTNET=true
    - export NEXT_PUBLIC_ACCOUNT=$ST_NEXT_PUBLIC_ACCOUNT
    - export NEXT_PUBLIC_ACTIVE_KEY_PUB=$ST_NEXT_PUBLIC_ACTIVE_KEY_PUB
    - export NEXT_PUBLIC_ACTIVE_KEY_PRIV=$ST_NEXT_PUBLIC_ACTIVE_KEY_PRIV
    - export NEXT_PUBLIC_OWNER_KEY_PUB=$ST_NEXT_PUBLIC_OWNER_KEY_PUB
    - export NEXT_PUBLIC_OWNER_KEY_PRIV=$ST_NEXT_PUBLIC_OWNER_KEY_PRIV
    - export NEXT_PUBLIC_WAX_CONTRACT=$ST_NEXT_PUBLIC_WAX_CONTRACT
    - export NEXT_PUBLIC_CARDS_NFT_COLLECTION=$ST_NEXT_PUBLIC_CARDS_NFT_COLLECTION
    - export NEXT_PUBLIC_CARDS_NFT_SCHEMA=$ST_NEXT_PUBLIC_CARDS_NFT_SCHEMA
    - export NEXT_PUBLIC_BANKNOTE_NFT_COLLECTION=$ST_NEXT_PUBLIC_BANKNOTE_NFT_COLLECTION
    - export NEXT_PUBLIC_BANKNOTE_NFT_SCHEMA=$ST_NEXT_PUBLIC_BANKNOTE_NFT_SCHEMA
    - rm -f package-lock.json
    - npm install -g npm@latest
    - npm install --progress=false

.before_script_production_template:
  before_script:
    - export NEXT_PUBLIC_ENABLE_GAME=true
    - export NEXT_PUBLIC_WAX_CONTRACT=$NEXT_PUBLIC_WAX_CONTRACT
    - export NEXT_PUBLIC_CARDS_NFT_COLLECTION=$NEXT_PUBLIC_CARDS_NFT_COLLECTION
    - export NEXT_PUBLIC_CARDS_NFT_SCHEMA=$NEXT_PUBLIC_CARDS_NFT_SCHEMA
    - export NEXT_PUBLIC_BANKNOTE_NFT_COLLECTION=$NEXT_PUBLIC_BANKNOTE_NFT_COLLECTION
    - export NEXT_PUBLIC_BANKNOTE_NFT_SCHEMA=$NEXT_PUBLIC_BANKNOTE_NFT_SCHEMA
    - rm -f package-lock.json
    - npm install -g npm@latest
    - npm install --progress=false
    - npm -v && node -v

build_production:
  image: node:lts
  stage: build
  extends: .before_script_production_template
  script:
    - npm run build
    - npm run export
  only:
    - main

build_staging:
  image: node:lts
  stage: build
  extends: .before_script_staging_template
  script:
    - npm run build
    - npm run export
  only:
    - feature/ci-cd

deploy_staging:
  image: node:lts-alpine
  stage: deploy
  extends: .before_script_staging_template
  script:
    - apk add --no-cache rsync openssh
    - apk add --update bash
    - apk add --update git
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - chmod 700 ~/.ssh
    - npm run build
    - npm run export
    - rsync -avz --delete -e ssh ./out/ "$STAGING_SERVER:haremu_front"
  only:
    - feature/ci-cd

