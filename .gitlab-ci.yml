stages:
  - build
  - deploy_production

build_landing:
  image: node:lts
  stage: build
  script:
    - export NEXT_PUBLIC_ENABLE_GAME=false
    - export NEXT_PUBLIC_WAX_CONTRACT=$NEXT_PUBLIC_WAX_CONTRACT
    - export NEXT_PUBLIC_CARDS_NFT_COLLECTION=$NEXT_PUBLIC_CARDS_NFT_COLLECTION
    - export NEXT_PUBLIC_CARDS_NFT_SCHEMA=$NEXT_PUBLIC_CARDS_NFT_SCHEMA
    - export NEXT_PUBLIC_BANKNOTE_NFT_COLLECTION=$NEXT_PUBLIC_BANKNOTE_NFT_COLLECTION
    - export NEXT_PUBLIC_BANKNOTE_NFT_SCHEMA=$NEXT_PUBLIC_BANKNOTE_NFT_SCHEMA
    - rm -f package-lock.json
    - npm install -g npm@latest
    - npm install --progress=false
    - npm -v && node -v
    - npm run build
  only:
    - main

